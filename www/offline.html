<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <title>燃律 · 正在重新连接</title>
    <style>
      :root {
        color-scheme: light;
        font-family: ui-rounded, "SF Pro Rounded", "SF Pro Display", "PingFang SC", system-ui, sans-serif;
        background: #f3f2fa;
        color: #272239;
      }

      * { box-sizing: border-box; }

      html, body { min-height: 100%; }

      body {
        margin: 0;
        min-height: 100dvh;
        overflow: hidden;
        background:
          radial-gradient(circle at 14% 4%, rgb(177 218 255 / 72%), transparent 32%),
          radial-gradient(circle at 88% 13%, rgb(217 180 255 / 72%), transparent 34%),
          radial-gradient(circle at 50% 94%, rgb(255 194 225 / 55%), transparent 40%),
          #f3f2fa;
      }

      body::before {
        position: fixed;
        inset: 0;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.92' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.16'/%3E%3C/svg%3E");
        content: "";
        opacity: .08;
        pointer-events: none;
      }

      main {
        position: relative;
        display: grid;
        min-height: 100dvh;
        place-items: center;
        padding: max(28px, env(safe-area-inset-top)) 24px max(28px, env(safe-area-inset-bottom));
      }

      .panel {
        width: min(100%, 390px);
        padding: 30px 26px 24px;
        border: 1px solid rgb(255 255 255 / 82%);
        border-radius: 34px;
        background: linear-gradient(145deg, rgb(255 255 255 / 78%), rgb(255 255 255 / 48%));
        box-shadow: 0 30px 80px rgb(82 62 115 / 14%), inset 0 1px 0 #fff;
        text-align: center;
        -webkit-backdrop-filter: blur(30px) saturate(140%);
        backdrop-filter: blur(30px) saturate(140%);
        animation: arrive .55s cubic-bezier(.2,.8,.2,1) both;
      }

      .mark-wrap {
        position: relative;
        width: 96px;
        height: 96px;
        margin: 0 auto 22px;
      }

      .mark-wrap::before {
        position: absolute;
        inset: -13px;
        border: 1px solid rgb(255 255 255 / 70%);
        border-radius: 34px;
        background: rgb(255 255 255 / 28%);
        box-shadow: 0 13px 38px rgb(101 77 152 / 14%);
        content: "";
        animation: breathe 2.8s ease-in-out infinite;
      }

      .mark {
        position: relative;
        display: block;
        width: 96px;
        height: 96px;
        border-radius: 25px;
        box-shadow: 0 14px 34px rgb(87 69 143 / 22%);
      }

      .eyebrow {
        margin: 0 0 9px;
        color: #8b7aa7;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: .18em;
      }

      h1 {
        margin: 0;
        font-size: clamp(27px, 8vw, 34px);
        font-weight: 760;
        letter-spacing: -.045em;
        line-height: 1.15;
      }

      .message {
        margin: 13px auto 0;
        max-width: 270px;
        color: #777084;
        font-size: 14px;
        line-height: 1.65;
      }

      .status {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        margin: 22px 0 17px;
        color: #6f667d;
        font-size: 12px;
        font-variant-numeric: tabular-nums;
      }

      .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #a28cc6;
        box-shadow: 0 0 0 5px rgb(162 140 198 / 13%);
        animation: pulse 1.6s ease-in-out infinite;
      }

      button {
        width: 100%;
        min-height: 50px;
        border: 1px solid rgb(255 255 255 / 50%);
        border-radius: 17px;
        background: linear-gradient(135deg, #826fc7, #b07db8);
        box-shadow: 0 12px 28px rgb(108 80 154 / 23%), inset 0 1px 0 rgb(255 255 255 / 25%);
        color: #fff;
        font: inherit;
        font-size: 15px;
        font-weight: 700;
        letter-spacing: -.01em;
        -webkit-tap-highlight-color: transparent;
      }

      button:active { transform: scale(.985); }

      .hint {
        margin: 15px 0 0;
        color: #9c94a6;
        font-size: 11px;
        line-height: 1.55;
      }

      @keyframes arrive {
        from { opacity: 0; transform: translateY(15px) scale(.98); }
      }

      @keyframes breathe {
        50% { transform: scale(1.045); background: rgb(255 255 255 / 42%); }
      }

      @keyframes pulse {
        50% { opacity: .35; transform: scale(.8); }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before { animation: none !important; transition: none !important; }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="panel" aria-labelledby="title">
        <div class="mark-wrap"><img class="mark" src="icon.png" alt="" /></div>
        <p class="eyebrow">PULSEFIT · 燃律</p>
        <h1 id="title">正在唤醒服务</h1>
        <p class="message">暂时无法连接到燃律服务器。你的本地训练记录仍保存在设备中。</p>
        <div class="status" role="status" aria-live="polite">
          <span class="dot" aria-hidden="true"></span>
          <span id="status-text">将在 10 秒后自动重试</span>
        </div>
        <button id="retry" type="button">立即重新连接</button>
        <p class="hint">请确认网络可用，或稍后再试。</p>
      </section>
    </main>
    <script>
      (() => {
        const configuredTarget = window.Capacitor?.getServerUrl?.();
        const target = /^https?:\/\//.test(configuredTarget ?? "")
          ? configuredTarget
          : "http://106.55.11.173";
        const status = document.querySelector("#status-text");
        const retry = document.querySelector("#retry");
        let remaining = 10;

        const reconnect = () => {
          status.textContent = "正在连接服务器…";
          location.replace(target);
        };

        retry.addEventListener("click", reconnect);
        window.addEventListener("online", reconnect);
        window.addEventListener("offline", () => {
          status.textContent = "设备当前处于离线状态";
        });

        if (!navigator.onLine) status.textContent = "设备当前处于离线状态";

        setInterval(() => {
          if (!navigator.onLine) return;
          remaining -= 1;
          if (remaining <= 0) reconnect();
          else status.textContent = `将在 ${remaining} 秒后自动重试`;
        }, 1000);
      })();
    </script>
  </body>
</html>
